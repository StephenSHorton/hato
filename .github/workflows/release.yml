name: Release

# Product releases (Tauri GUI / Windows NSIS installers) are discontinued.
# Transfer ships inside StephenSHorton/suzuri.
#
# This workflow stays as a no-op so old tags / docs that mention it do not
# accidentally publish a new "Hato app" release. To cut an engine-only
# artifact for debugging, build locally:
#   cargo build --release -p hato-cli
#
# For user-facing downloads, cut a suzuri tag instead.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "This workflow does not publish assets. Use suzuri releases."
        required: false
        default: "discontinued"

permissions:
  contents: read

jobs:
  discontinued:
    runs-on: ubuntu-latest
    steps:
      - name: Product releases moved to suzuri
        run: |
          echo "Hato standalone app releases are discontinued."
          echo "Download: https://github.com/StephenSHorton/suzuri/releases/latest"
          echo "Engine source: this repo (cargo build -p hato-cli)."
          exit 1
