[package]
name = "hato-mailbox"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hato's rendezvous mailbox: a zero-knowledge axum WebSocket server that relays SPAKE2 handshakes between two sides of a single-use nameplate. No DB, no disk."

[lib]
name = "hato_mailbox"
path = "src/lib.rs"

[[bin]]
name = "hato-mailbox"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { workspace = true }
tower_governor = "0.4"
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
hato-code = { path = "../hato-code" }
tokio = { workspace = true }
