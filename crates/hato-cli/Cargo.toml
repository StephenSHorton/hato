[package]
name = "hato-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The `hato` command-line app — a carrier pigeon for your files."

[[bin]]
name = "hato"
path = "src/main.rs"

# Product name when shipped inside suzuri (same code as `hato`).
[[bin]]
name = "suzuri-transfer"
path = "src/main.rs"

[dependencies]
hato-core = { path = "../hato-core" }
hato-code = { path = "../hato-code" }
iroh = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
indicatif = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
