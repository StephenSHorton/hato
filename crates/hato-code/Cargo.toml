[package]
name = "hato-code"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Short human-readable transfer codes for Hato: PGP-word codes + SPAKE2 over a zero-knowledge WebSocket mailbox. No iroh dependency — pure crypto + WebSocket, works in bytes."

[dependencies]
# --- PAKE + key schedule + AEAD (RustCrypto, MIT/Apache) ---
spake2 = "0.4"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
zeroize = "1"
rand = "0.8"
getrandom = "0.2"

# --- WebSocket mailbox client ---
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }

# --- encoding / misc ---
serde = { workspace = true }
serde_json = { workspace = true }
data-encoding = "2"
unicode-normalization = "0.1"
thiserror = "1"
url = "2"
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
